<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — CollabX</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <h1>Log In</h1>
    <p class="subtitle">Welcome back to CollabX</p>
    <div class="auth-error" id="error"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-input" placeholder="you@university.edu" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-dark">Log In →</button>
    </form>
    <div class="divider"><span>or</span></div>
    <div id="google-btn"></div>
    <p class="auth-footer">Don't have an account? <a href="/register.html">Sign up</a></p>
    <p style="text-align: center; margin-top: 16px; font-size: 0.9rem;">
      <a href="/admin.html" style="color: var(--red); font-weight: 700;">Admin Login</a>
    </p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  if (isLoggedIn()) window.location.href = '/dashboard.html';

  async function handleGoogleLogin(response) {
    const errEl = document.getElementById('error');
    errEl.style.display = 'none';
    try {
      const data = await api('/auth/google', {
        method: 'POST',
        body: { credential: response.credential }
      });
      setAuth(data.token, data.user);
      window.location.href = '/dashboard.html';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    }
  }

  // Initialize Google Sign-In with server-provided client ID
  function initGoogle() {
    fetch('/api/config/google-client-id').then(r => r.json()).then(({ clientId }) => {
      if (!clientId) return;
      google.accounts.id.initialize({ client_id: clientId, callback: handleGoogleLogin });
      google.accounts.id.renderButton(document.getElementById('google-btn'), {
        theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular', width: 350
      });
    });
  }
  // Wait for the Google library to load
  if (typeof google !== 'undefined' && google.accounts) { initGoogle(); }
  else { window.addEventListener('load', () => { initGoogle(); }); }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('error');
    errEl.style.display = 'none';
    const btn = e.target.querySelector('button');
    btn.disabled = true; btn.textContent = 'Logging in...';

    try {
      const data = await api('/auth/login', {
        method: 'POST',
        body: { email: document.getElementById('email').value, password: document.getElementById('password').value }
      });
      setAuth(data.token, data.user);
      window.location.href = '/dashboard.html';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Log In →';
    }
  });
</script>
</body>
</html>
